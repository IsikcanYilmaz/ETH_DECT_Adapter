# JLINK
CONFIG_SEGGER_DEBUGMON=y
CONFIG_CORTEX_M_DEBUG_MONITOR_HOOK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# CONFIG_UART_ASYNC_API=y
CONFIG_NET_BUF=y
CONFIG_RING_BUFFER=y

# Basic
CONFIG_GPIO=y
# CONFIG_INPUT=y
CONFIG_DK_LIBRARY=y

# Logging
CONFIG_LOG=y
#CONFIG_LOG_MODE_IMMEDIATE=n
#CONFIG_LOG_MODE_DEFERRED=y
#CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_RUNTIME_FILTERING=y

# Shell configurations
CONFIG_SHELL=y
CONFIG_SHELL_WILDCARD=n
CONFIG_SHELL_PROMPT_UART="desh:~$ "
CONFIG_SHELL_ARGC_MAX=40
CONFIG_SHELL_CMDS=y
CONFIG_LOG_CMDS=y
CONFIG_DATE_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_SHELL_HELP=y

# Note that NR+ modem FW supports a limited set of AT commands
CONFIG_AT_SHELL=y

# -h and --help options are handled in Dect Shell
CONFIG_SHELL_HELP_OPT_PARSE=y
CONFIG_SHELL_CMD_BUFF_SIZE=1024
# Shell stack has most impact for DECT shell application, not CONFIG_MAIN_STACK_SIZE
CONFIG_SHELL_STACK_SIZE=4096
# Main stack size need to be increased due to CONFIG_NRF_MODEM_LIB_TRACE
CONFIG_MAIN_STACK_SIZE=2048

# Shell RX buffer needs to be increased to avoid problems with test automation
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=512
# Use interrupt driven shell UART, otherwise we won't be able to suspend the UART
CONFIG_SHELL_BACKEND_SERIAL_API_INTERRUPT_DRIVEN=y

# Dect Phy modem
CONFIG_NRF_MODEM_LIB=y
CONFIG_MODEM_ANTENNA=n
CONFIG_NRF_MODEM_LINK_BINARY_DECT_PHY=y
CONFIG_NRF_MODEM_LINK_BINARY_DECT=y
CONFIG_HWINFO=y
CONFIG_NRF_MODEM_LIB_SHMEM_TX_SIZE=5000
CONFIG_NRF_MODEM_LIB_SHMEM_RX_SIZE=5000

# helps a lot when bringing this up the first time
CONFIG_NET_LOG=y
CONFIG_NET_SHELL=y

# Below taken from the promiscuous mode sample code
# Generic networking options
CONFIG_NETWORKING=n
CONFIG_NET_UDP=n
CONFIG_NET_TCP=n
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=n
#CONFIG_NET_DHCPV4=y

# Enable promiscuous mode support
CONFIG_NET_PROMISCUOUS_MODE=n

# Kernel options
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_INIT_STACKS=y

# Logging
CONFIG_NET_LOG=n
CONFIG_LOG=y
CONFIG_NET_STATISTICS=n
CONFIG_PRINTK=y

# Network buffers
# CONFIG_NET_PKT_RX_COUNT=64
# CONFIG_NET_PKT_TX_COUNT=64
# CONFIG_NET_BUF_RX_COUNT=128
# CONFIG_NET_BUF_TX_COUNT=128
# CONFIG_NET_CONTEXT_NET_PKT_POOL=y

# IP address options
# CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=3
# CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=4

# Network shell
CONFIG_NET_SHELL=n

# Network application options and configuration
# CONFIG_NET_CONFIG_SETTINGS=y
# CONFIG_NET_CONFIG_NEED_IPV6=n
# CONFIG_NET_CONFIG_NEED_IPV4=n
# CONFIG_NET_CONFIG_MY_IPV6_ADDR="2001:db8::1"
# CONFIG_NET_CONFIG_PEER_IPV6_ADDR="2001:db8::2"
# CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
# CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.0.2.2"

CONFIG_SPI=y
# CONFIG_ETH_W5500=y
# CONFIG_NET_SOCKETS_OFFLOAD=n
# CONFIG_NET_PROMISCUOUS_MODE=y
# CONFIG_ETH_W5500_MONITOR_PERIOD=1
# CONFIG_NET_SOCKETS_PACKET=y
# CONFIG_NET_SOCKETS=y
# CONFIG_POSIX_API=y
# CONFIG_NET_BUF_POOL_USAGE=y
# CONFIG_NET_DEBUG_NET_PKT_ALLOC=y

CONFIG_HEAP_MEM_POOL_SIZE=100000
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_SYS_HEAP_INFO=y

CONFIG_THREAD_ANALYZER=n
CONFIG_THREAD_ANALYZER_AUTO=n
CONFIG_THREAD_NAME=n
CONFIG_W5500_INTERRUPTLESS=y

CONFIG_PHY_IMPL=y
CONFIG_MAC_IMPL=n

CONFIG_SPEED_OPTIMIZATIONS=y

CONFIG_APP_MCS=4
